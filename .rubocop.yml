AllCops:
  NewCops: enable
  Exclude:
    - test/**/*
    # The timing probes in docs/profiling are throwaway measuring instruments,
    # not runner code. They deliberately do things the cops object to, such as
    # printf'ing tables and hand-rolling HTTP, and holding them to the same
    # standard buys nothing.
    - docs/**/*

Layout/EmptyLineAfterMagicComment:
  Exclude:
    - source/server/**/*
    - source/client/**/*

Layout/LineLength:
  Exclude:
    - source/client/demo.rb

Lint/RescueException:
  Exclude:
    - source/*/dispatcher.rb
    - source/*/rack_dispatcher.rb
    - source/server/traffic_light.rb

Lint/UselessMethodDefinition:
  Exclude:
    - source/server/lib/empty_binding.rb

Metrics/AbcSize:
  Exclude:
    - source/server/runner.rb
    - source/*/dispatcher.rb
    - source/server/context.rb
    - source/client/demo.rb

Metrics/ClassLength:
  Exclude:
    - source/server/runner.rb
    - source/server/traffic_light.rb
    - source/client/demo.rb

Metrics/CyclomaticComplexity:
  Exclude:
    - source/*/dispatcher.rb
    - source/server/context.rb

Metrics/MethodLength:
  Exclude:
    - source/server/traffic_light.rb
    - source/server/runner.rb
    - source/server/node_images.rb
    - source/server/files_delta.rb
    - source/*/dispatcher.rb
    - source/client/demo.rb
    - source/server/home_files.rb
    # context.rb's initialize names every collaborator once, so it grows by a
    # line for each service added and shrinks by one for each removed. Naming
    # them is the file's whole job, and it is excluded from Metrics/AbcSize
    # for the same reason.
    - source/server/context.rb
    # cyber_dojo_sh_oci_config.rb's masked_paths is one entry per path dockerd
    # masks, and the list is moby's rather than this repo's. Splitting it to
    # fit would put half of one list in a method of its own.
    - source/server/cyber_dojo_sh_oci_config.rb

Metrics/ModuleLength:
  Exclude:
    # cyber_dojo_sh_oci_config.rb states a boundary by enumerating it: the
    # capabilities, the namespaces, the masked paths and the read-only paths
    # are each a list with one entry per line. The length is the size of what
    # dockerd applies, and shortening it would only move the lists elsewhere.
    - source/server/cyber_dojo_sh_oci_config.rb

Metrics/ParameterLists:
  Exclude:
    - source/server/runner.rb

Metrics/PerceivedComplexity:
  Exclude:
    - source/server/context.rb

Style/Documentation:
  Exclude:
    - source/*/**/*

Style/FrozenStringLiteralComment:
  Exclude:
    - source/**/*

Style/RedundantInitialize:
  Exclude:
    - source/server/prober.rb
