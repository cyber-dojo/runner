name: Start-point tests

# Runs each cyber-dojo-start-points repo's own run_tests.sh against the runner
# image built from this commit, checking its start_point files still go red,
# amber and green. Those repos normally test against the released runner, so
# this is where a runner change that breaks a language shows up first.
#
# The image is pulled, not built. The main workflow already builds and pushes
# it on every push, and ECR tags are immutable, so building it again under the
# same tag would fail. Pulling is also what lets this workflow be run more than
# once on the same commit.
#
# The main workflow calls this on every push, alongside the unit and
# integration tests, and its SDLC gate waits for it, so a runner that breaks a
# start-point cannot deploy. It can also be run by hand, on a chosen few
# start-points.
#
# Only the three traffic-lights are checked (--lights-only). A start-point's
# fixtures test the start-point, and they are most of its run time; the lights
# are what a runner change breaks. The start-points are split into shards, one
# job each, so the setup every job repeats is paid once per shard.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      start_points:
        description: 'Start-points to test, space separated, eg "java-junit ruby-minitest". Empty tests all of them.'
        required: false
        type: string
        default: ''

jobs:

  start-points:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: cyber-dojo/harden-runner@main
      - uses: cyber-dojo/pinned-checkout@main

      - name: Checkout languages-start-points for its git_repo_urls.tagged file
        uses: actions/checkout@v6
        with:
          repository: cyber-dojo/languages-start-points
          path: languages-start-points
          fetch-depth: 1

      - name: Prepare the start-points matrix
        id: matrix
        env:
          START_POINTS: ${{ inputs.start_points }}
        run: |
          # Unquoted, so each name becomes an argument of its own.
          matrix="$(./bin/echo_start_points_matrix.sh \
            languages-start-points/git_repo_urls.tagged ${START_POINTS})"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Start-points under test"
            echo "${matrix}" | jq --raw-output '.[] | "- \(.name)"'
          } >> "${GITHUB_STEP_SUMMARY}"


  test-start-points:
    needs: [start-points]
    runs-on: ubuntu-latest
    name: ${{ matrix.shard.name }}
    permissions:
      id-token: write
      contents: read
    strategy:
      # One broken language must not hide the state of all the others.
      fail-fast: false
      # One job per shard. bin/echo_start_points_matrix.sh sets how many, and
      # so how many run at once.
      matrix:
        shard: ${{ fromJSON(needs.start-points.outputs.matrix) }}
    steps:
      - uses: cyber-dojo/harden-runner@main
      - uses: cyber-dojo/pinned-checkout@main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gh_actions_services
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 2400
          role-session-name: ${{ github.event.repository.name }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull the runner image built for this commit
        run: ./bin/pull_runner_image.sh

      # Every start-point in the shard is run, whatever the ones before it did,
      # and the job fails at the end naming each one whose lights went wrong.
      - name: Run each start-point's run_tests.sh against this runner image
        env:
          TAGGED_URLS: ${{ matrix.shard.tagged_urls }}
        run: |
          failed=()
          for tagged_url in ${TAGGED_URLS}; do
            ./bin/test_one_start_point.sh "${tagged_url}" --lights-only \
              || failed+=("${tagged_url##*/}")
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "Lights went wrong for: ${failed[*]}"
            exit 1
          fi
